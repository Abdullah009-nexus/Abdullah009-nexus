<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Abdullah Shoaib - Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#173B5E"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title{font:700 54px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:url(#txt);opacity:0;animation:rise 1s .2s ease-out forwards}
      .sub{font:500 20px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#CBD5E1;letter-spacing:3px;opacity:0;animation:rise 1s .6s ease-out forwards}
      .tag{font:400 15px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#94A3B8;opacity:0;animation:rise 1s 1s ease-out forwards}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      .dot{animation:float 6s ease-in-out infinite}
      .d2{animation-duration:8s;animation-delay:-2s}.d3{animation-duration:7s;animation-delay:-4s}
      @keyframes float{0%,100%{transform:translateY(0);opacity:.25}50%{transform:translateY(-18px);opacity:.8}}
      .orb{animation:pulse 5s ease-in-out infinite;transform-origin:820px 90px}
      @keyframes pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.15);opacity:1}}
      .wave{animation:drift 12s linear infinite}
      .wave2{animation:drift 18s linear infinite reverse}
      @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-500px)}}
      .line{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.6s .4s ease-out forwards}
      @keyframes draw{to{stroke-dashoffset:0}}
    </style>
  </defs>
  <rect width="1000" height="260" fill="url(#bg)"/>
  <circle class="orb" cx="820" cy="90" r="150" fill="url(#glow)"/>
  <g fill="#7DD3FC">
    <circle class="dot" cx="90" cy="70" r="3"/>
    <circle class="dot d2" cx="210" cy="190" r="2.5"/>
    <circle class="dot d3" cx="620" cy="50" r="3"/>
    <circle class="dot" cx="760" cy="170" r="2"/>
    <circle class="dot d2" cx="910" cy="60" r="3"/>
    <circle class="dot d3" cx="940" cy="180" r="2.5"/>
  </g>
  <text class="title" x="500" y="108" text-anchor="middle">Abdullah Shoaib</text>
  <line class="line" x1="290" y1="128" x2="710" y2="128" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <text class="sub" x="500" y="164" text-anchor="middle">SOFTWARE ENGINEER</text>
  <text class="tag" x="500" y="192" text-anchor="middle">AI · Full-Stack Development · Automation</text>
  <g class="wave"><path d="M0 225 Q125 195 250 225 T500 225 T750 225 T1000 225 T1250 225 T1500 225 V260 H0 Z" fill="url(#w1)"/></g>
  <g class="wave2"><path d="M0 238 Q125 214 250 238 T500 238 T750 238 T1000 238 T1250 238 T1500 238 V260 H0 Z" fill="#38BDF8" fill-opacity="0.18"/></g>
</svg>
